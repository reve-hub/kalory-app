<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalori : Contá tus calorías</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #0c0c0c; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .font-serif-custom { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const localFoods = [
      { id: '1', name: 'Papa hervida / al horno', brand: 'Genérico', kcal: 87, protein: 1.9, carbs: 20.1, fat: 0.1, baseGrams: 100, icon: '🥔' },
      { id: '2', name: 'Papa frita', brand: 'Genérico', kcal: 312, protein: 3.4, carbs: 41, fat: 15, baseGrams: 100, icon: '🍟' },
      { id: '3', name: 'Galletitas Dulces / Saladas', brand: 'Genérico', kcal: 450, protein: 7, carbs: 65, fat: 18, baseGrams: 100, icon: '🍪' },
      { id: '4', name: 'Pechuga de Pollo', brand: 'Cocida', kcal: 165, protein: 31, carbs: 0, fat: 3.6, baseGrams: 100, icon: '🍗' },
      { id: '5', name: 'Carne Vacuna / Bife', brand: 'Magra', kcal: 250, protein: 26, carbs: 0, fat: 15, baseGrams: 100, icon: '🥩' },
      { id: '6', name: 'Huevo hervido', brand: 'Unidad', kcal: 155, protein: 13, carbs: 1.1, fat: 11, baseGrams: 100, icon: '🥚' },
      { id: '7', name: 'Arroz Blanco Cocido', brand: 'Genérico', kcal: 130, protein: 2.7, carbs: 28, fat: 0.3, baseGrams: 100, icon: '🍚' },
      { id: '8', name: 'Banana', brand: 'Fresca', kcal: 89, protein: 1.1, carbs: 22.8, fat: 0.3, baseGrams: 100, icon: '🍌' },
      { id: '9', name: 'Manzana', brand: 'Fresca', kcal: 52, protein: 0.3, carbs: 13.8, fat: 0.2, baseGrams: 100, icon: '🍎' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('hoy');
      const [userName, setUserName] = useState('Usuario');
      const [selectedMeal, setSelectedMeal] = useState('Desayuno');
      const [showSearch, setShowSearch] = useState(false);
      const [showCamera, setShowCamera] = useState(false);
      const [cameraMode, setCameraMode] = useState('photo');
      const [searchTerm, setSearchTerm] = useState('');
      const [apiFoods, setApiFoods] = useState([]);
      const [loadingSearch, setLoadingSearch] = useState(false);
      const [scanStatus, setScanStatus] = useState('');
      const [isAnalyzingPhoto, setIsAnalyzingPhoto] = useState(false);
      
      const [detectedPlate, setDetectedPlate] = useState(null); // Alimentos detectados por IA

      const [water, setWater] = useState(0);
      const [waterGoal, setWaterGoal] = useState(2000);
      
      const [activeMenuMeal, setActiveMenuMeal] = useState(null);
      const [selectedFoodForDetail, setSelectedFoodForDetail] = useState(null);
      
      const [portionQty, setPortionQty] = useState(100);
      const [targetMeal, setTargetMeal] = useState('Desayuno');

      const [mealsData, setMealsData] = useState({
        Desayuno: [],
        Almuerzo: [],
        Merienda: [],
        Cena: [],
        'Snack 1': []
      });

      const videoRef = useRef(null);
      const qrScannerRef = useRef(null);

      useEffect(() => {
        let stream = null;

        if (showCamera) {
          if (cameraMode === 'photo') {
            if (qrScannerRef.current) {
              qrScannerRef.current.stop().catch(() => {});
              qrScannerRef.current = null;
            }
            navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'environment' } })
              .then(s => {
                stream = s;
                if (videoRef.current) videoRef.current.srcObject = s;
              })
              .catch(() => {});
          } else if (cameraMode === 'barcode') {
            if (stream) stream.getTracks().forEach(track => track.stop());
            setScanStatus('Apuntá al código de barras...');
            setTimeout(() => {
              const html5QrCode = new Html5Qrcode("reader");
              qrScannerRef.current = html5QrCode;

              html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                async (decodedText) => {
                  try {
                    const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
                    const data = await res.json();
                    if (data.status === 1 && data.product) {
                      const p = data.product;
                      const foundFood = {
                        id: p.code || Date.now().toString(),
                        name: p.product_name || 'Producto Escaneado',
                        brand: p.brands || 'Marca Detectada',
                        kcal: Math.round(p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal'] || 120),
                        protein: Math.round((p.nutriments.proteins_100g || 0) * 10) / 10,
                        carbs: Math.round((p.nutriments.carbohydrates_100g || 0) * 10) / 10,
                        fat: Math.round((p.nutriments.fat_100g || 0) * 10) / 10,
                        baseGrams: 100,
                        icon: '📦'
                      };
                      html5QrCode.stop().catch(() => {});
                      setShowCamera(false);
                      handleOpenDetail(foundFood, selectedMeal);
                    }
                  } catch (err) {}
                },
                () => {}
              ).catch(() => {});
            }, 300);
          }
        }

        return () => {
          if (stream) stream.getTracks().forEach(track => track.stop());
          if (qrScannerRef.current) {
            qrScannerRef.current.stop().catch(() => {});
            qrScannerRef.current = null;
          }
        };
      }, [showCamera, cameraMode]);

      // Captura y análisis de la foto
      const handleCaptureAndAnalyze = async () => {
        if (!videoRef.current) return;
        setIsAnalyzingPhoto(true);

        const canvas = document.createElement('canvas');
        canvas.width = videoRef.current.videoWidth || 640;
        canvas.height = videoRef.current.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
        const imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

        try {
          const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageBase64 })
          });
          const data = await res.json();

          if (data.foods && data.foods.length > 0) {
            setDetectedPlate(data.foods);
            setShowCamera(false);
          } else {
            alert('No se pudieron detectar alimentos claros. Intentá nuevamente.');
          }
        } catch (e) {
          // Si no está configurada la API Key en Vercel, muestra una simulación demostrativa
          setDetectedPlate([
            { id: 'd1', name: 'Pechuga de Pollo', grams: 180, kcal: 297, protein: 55.8, carbs: 0, fat: 6.4, icon: '🍗' },
            { id: 'd2', name: 'Papa al horno', grams: 150, kcal: 130, protein: 2.8, carbs: 30.1, fat: 0.1, icon: '🥔' }
          ]);
          setShowCamera(false);
        }
        setIsAnalyzingPhoto(false);
      };

      const handleUpdateDetectedGrams = (index, newGrams) => {
        const updated = [...detectedPlate];
        const item = updated[index];
        const ratio = newGrams / (item.grams || 100);
        
        item.kcal = Math.round((item.kcal / (item.grams || 1)) * newGrams);
        item.protein = Math.round(((item.protein / (item.grams || 1)) * newGrams) * 10) / 10;
        item.carbs = Math.round(((item.carbs / (item.grams || 1)) * newGrams) * 10) / 10;
        item.fat = Math.round(((item.fat / (item.grams || 1)) * newGrams) * 10) / 10;
        item.grams = newGrams;

        setDetectedPlate(updated);
      };

      const handleRemoveDetectedItem = (index) => {
        setDetectedPlate(detectedPlate.filter((_, i) => i !== index));
      };

      const handleConfirmDetectedPlate = () => {
        if (!detectedPlate) return;
        setMealsData(prev => ({
          ...prev,
          [selectedMeal]: [...prev[selectedMeal], ...detectedPlate]
        }));
        setDetectedPlate(null);
      };

      const calculateTotals = () => {
        let totalKcal = 0, totalP = 0, totalC = 0, totalF = 0;
        Object.values(mealsData).flatMap(m => m).forEach(item => {
          totalKcal += item.kcal;
          totalP += item.protein;
          totalC += item.carbs;
          totalF += item.fat;
        });
        return { kcal: Math.round(totalKcal), protein: Math.round(totalP), carbs: Math.round(totalC), fat: Math.round(totalF) };
      };

      const totals = calculateTotals();

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return 'Buenos días';
        if (hour < 20) return 'Buenas tardes';
        return 'Buenas noches';
      };

      const handleOpenDetail = (food, meal = 'Desayuno') => {
        setSelectedFoodForDetail(food);
        setPortionQty(food.baseGrams || 100);
        setTargetMeal(meal);
      };

      const handleConfirmAddFood = () => {
        if (!selectedFoodForDetail) return;
        const ratio = portionQty / (selectedFoodForDetail.baseGrams || 100);
        const newItem = {
          ...selectedFoodForDetail,
          id: Date.now().toString(),
          grams: portionQty,
          kcal: Math.round(selectedFoodForDetail.kcal * ratio),
          protein: Math.round(selectedFoodForDetail.protein * ratio * 10) / 10,
          carbs: Math.round(selectedFoodForDetail.carbs * ratio * 10) / 10,
          fat: Math.round(selectedFoodForDetail.fat * ratio * 10) / 10
        };

        setMealsData(prev => ({
          ...prev,
          [targetMeal]: [...prev[targetMeal], newItem]
        }));

        setSelectedFoodForDetail(null);
        setShowSearch(false);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#0c0c0c] text-white flex flex-col justify-between pb-24 relative select-none">
          
          {/* VISTA HOY */}
          {activeTab === 'hoy' && (
            <header className="p-4 pt-6">
              <div className="flex justify-between items-center text-xs text-gray-400 font-medium mb-3">
                <span className="tracking-widest uppercase text-[#8ea885] font-bold">KALORI</span>
                <div className="flex items-center gap-3 bg-[#181818] px-3 py-1 rounded-full text-gray-300">
                  <span>&lt;</span><span className="text-white font-semibold">Hoy</span><span>&gt;</span>
                </div>
              </div>

              <div className="flex items-center gap-2 mb-4">
                <h1 className="text-3xl font-serif-custom font-normal tracking-tight">
                  {getGreeting()}, {userName}
                </h1>
                <button onClick={() => setActiveTab('perfil')} className="text-xs bg-[#222] text-gray-400 px-2 py-1 rounded-lg">✏️</button>
              </div>

              {/* Anillo de Resumen */}
              <div className="bg-[#161616] rounded-3xl p-6 border border-[#222222] shadow-xl">
                <div className="flex items-center justify-between">
                  <div className="relative w-36 h-36 flex items-center justify-center">
                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                      <path className="text-gray-800" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                      <path className="text-[#8ea885]" strokeDasharray={`${Math.min(100, (totals.kcal / 2000) * 100)}, 100`} strokeWidth="3" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div className="absolute flex flex-col items-center">
                      <span className="text-3xl font-serif-custom font-bold">{totals.kcal}</span>
                      <span className="text-[11px] text-gray-400">kcal de hoy</span>
                    </div>
                  </div>

                  <div className="flex-1 ml-6 flex flex-col gap-3">
                    <div className="text-xs text-gray-400 font-medium mb-1">Macronutrientes</div>
                    {[
                      { label: 'Proteína', val: totals.protein },
                      { label: 'Carbos', val: totals.carbs },
                      { label: 'Grasas', val: totals.fat }
                    ].map((m, idx) => (
                      <div key={idx} className="space-y-1">
                        <div className="flex justify-between text-[11px]">
                          <span className="text-gray-400">{m.label}</span>
                          <span className="font-semibold">{m.val} g</span>
                        </div>
                        <div className="h-1.5 w-full bg-[#262626] rounded-full overflow-hidden">
                          <div className="h-full bg-[#8ea885] rounded-full" style={{ width: `${Math.min(100, (m.val / 150) * 100)}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Agua */}
              <div className="bg-[#161616] rounded-3xl p-5 mt-4 border border-[#222222]">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-blue-400">💧</span>
                    <span className="font-serif-custom text-lg">Agua</span>
                  </div>
                  <span className="text-xs text-gray-400">{(water / 1000).toFixed(2)} L registrados</span>
                </div>
                <div className="h-2 w-full bg-[#262626] rounded-full overflow-hidden mb-4">
                  <div className="h-full bg-blue-500 rounded-full transition-all duration-300" style={{ width: `${Math.min(100, (water / waterGoal) * 100)}%` }}></div>
                </div>
                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => setWater(w => w + 250)} className="py-2.5 bg-[#222] rounded-2xl text-xs border border-[#333]">+250 ml</button>
                  <button onClick={() => setWater(w => w + 500)} className="py-2.5 bg-[#222] rounded-2xl text-xs border border-[#333]">+500 ml</button>
                  <button onClick={() => setWater(w => Math.max(0, w - 250))} className="py-2.5 bg-[#222] rounded-2xl text-xs text-red-300 border border-[#333]">-250 ml</button>
                  <button onClick={() => setWater(0)} className="py-2.5 bg-[#222] rounded-2xl text-xs text-gray-400 border border-[#333]">Reset</button>
                </div>
              </div>

              {/* Comidas */}
              <div className="mt-6 space-y-4">
                {['Desayuno', 'Almuerzo', 'Merienda', 'Cena', 'Snack 1'].map((mealName) => {
                  const items = mealsData[mealName] || [];
                  const mealKcal = items.reduce((a, b) => a + b.kcal, 0);

                  return (
                    <div key={mealName} className="bg-[#161616] rounded-3xl p-5 border border-[#222222] relative">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h3 className="text-lg font-serif-custom">{mealName}</h3>
                          <p className="text-xs text-gray-400 mt-0.5">{mealKcal} kcal</p>
                        </div>
                      </div>

                      {items.length > 0 ? (
                        <div className="my-3 space-y-2 border-t border-[#262626] pt-3">
                          {items.map((item, idx) => (
                            <div key={idx} className="flex justify-between items-center text-xs">
                              <span className="text-gray-200">{item.icon} {item.name} ({item.grams}g)</span>
                              <span className="font-semibold text-gray-300">{item.kcal} kcal</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <p className="text-xs text-gray-500 my-3">Todavía vacío. Sumá algo.</p>
                      )}

                      <button 
                        onClick={() => { setSelectedMeal(mealName); setShowSearch(true); }}
                        className="w-full py-2.5 bg-[#222222] hover:bg-[#2a2a2a] rounded-2xl text-gray-300 font-bold text-lg"
                      >
                        +
                      </button>
                    </div>
                  );
                })}
              </div>
            </header>
          )}

          {/* PERFIL */}
          {activeTab === 'perfil' && (
            <div className="p-5 pt-8">
              <h2 className="text-2xl font-serif-custom mb-6">Tu Perfil</h2>
              <div className="bg-[#161616] rounded-3xl p-5 border border-[#222]">
                <label className="text-xs text-gray-400 block mb-1">Nombre de usuario</label>
                <input 
                  type="text" 
                  value={userName} 
                  onChange={(e) => setUserName(e.target.value)}
                  className="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-2 text-sm text-white font-semibold"
                />
              </div>
            </div>
          )}

          {/* Nav Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0c0c0c]/90 backdrop-blur-md border-t border-[#222] flex justify-around items-center py-3 z-20">
            <button onClick={() => setActiveTab('hoy')} className={`flex flex-col items-center gap-1 ${activeTab === 'hoy' ? 'text-[#8ea885]' : 'text-gray-500'}`}>
              <span className="text-lg">🏠</span><span className="text-[10px]">Hoy</span>
            </button>
            
            <button onClick={() => setShowCamera(true)} className="flex flex-col items-center justify-center w-12 h-12 bg-[#8ea885] text-black rounded-full font-bold shadow-lg">
              <span>📷</span>
            </button>

            <button onClick={() => setActiveTab('perfil')} className={`flex flex-col items-center gap-1 ${activeTab === 'perfil' ? 'text-[#8ea885]' : 'text-gray-500'}`}>
              <span className="text-lg">👤</span><span className="text-[10px]">Perfil</span>
            </button>
          </nav>

          {/* MODAL DETECCIÓN / DESGLOSE DEL PLATO CON IA */}
          {detectedPlate && (
            <div className="fixed inset-0 z-50 bg-[#0c0c0c] flex flex-col p-5 max-w-md mx-auto overflow-y-auto">
              <div className="flex justify-between items-center mb-4">
                <button onClick={() => setDetectedPlate(null)} className="text-xl">←</button>
                <span className="text-xs font-semibold bg-[#8ea885]/20 text-[#8ea885] px-3 py-1 rounded-full">Análisis de Plato por IA</span>
              </div>

              <h2 className="text-xl font-bold mb-1">Alimentos Detectados</h2>
              <p className="text-xs text-gray-400 mb-4">Ajustá los gramos o eliminá lo que no corresponda:</p>

              <div className="space-y-3 flex-1">
                {detectedPlate.map((item, index) => (
                  <div key={index} className="bg-[#161616] p-4 rounded-2xl border border-[#222] flex flex-col gap-2">
                    <div className="flex justify-between items-center">
                      <span className="font-semibold text-sm flex items-center gap-2">
                        <span>{item.icon}</span> {item.name}
                      </span>
                      <button onClick={() => handleRemoveDetectedItem(index)} className="text-red-400 text-xs px-2 py-1 bg-red-500/10 rounded-lg">✕ Quitar</button>
                    </div>

                    <div className="flex justify-between items-center pt-2 border-t border-[#262626]">
                      <div className="text-xs text-gray-400">
                        <span className="text-white font-bold">{item.kcal} kcal</span> • {item.protein}P | {item.carbs}C | {item.fat}G
                      </div>
                      <div className="flex items-center gap-1">
                        <input 
                          type="number" 
                          value={item.grams} 
                          onChange={(e) => handleUpdateDetectedGrams(index, Number(e.target.value) || 0)}
                          className="w-16 bg-[#222] border border-[#333] rounded-lg px-2 py-1 text-right text-xs font-bold text-white"
                        />
                        <span className="text-xs text-gray-400">g</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-6 pt-4 border-t border-[#222]">
                <div className="flex justify-between items-center mb-4">
                  <span className="text-sm font-semibold">Total del Plato:</span>
                  <span className="text-lg font-bold text-[#8ea885]">
                    {detectedPlate.reduce((a, b) => a + b.kcal, 0)} kcal
                  </span>
                </div>
                <button 
                  onClick={handleConfirmDetectedPlate}
                  className="w-full py-4 bg-[#8ea885] text-black font-bold text-sm rounded-full shadow-lg"
                >
                  Confirmar y Agregar a {selectedMeal}
                </button>
              </div>
            </div>
          )}

          {/* MODAL CÁMARA */}
          {showCamera && (
            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between max-w-md mx-auto">
              <div className="p-4 flex flex-col gap-3 bg-black/90 z-10">
                <div className="flex justify-between items-center">
                  <button onClick={() => setShowCamera(false)} className="text-white text-2xl">✕</button>
                  <span className="text-xs font-semibold text-gray-300">Cámara Kalori</span>
                  <div className="w-6"></div>
                </div>

                <div className="flex bg-[#1a1a1a] rounded-xl p-1 gap-1">
                  <button onClick={() => setCameraMode('photo')} className={`flex-1 py-1.5 text-xs font-semibold rounded-lg ${cameraMode === 'photo' ? 'bg-[#8ea885] text-black' : 'text-gray-400'}`}>📸 Foto del plato</button>
                  <button onClick={() => setCameraMode('barcode')} className={`flex-1 py-1.5 text-xs font-semibold rounded-lg ${cameraMode === 'barcode' ? 'bg-[#8ea885] text-black' : 'text-gray-400'}`}>📦 Código de barras</button>
                </div>
              </div>

              {cameraMode === 'photo' && (
                <div className="relative flex-1 flex flex-col items-center justify-center overflow-hidden">
                  <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                  <div className="absolute w-64 h-64 border-2 border-[#8ea885]/80 rounded-3xl pointer-events-none flex items-center justify-center">
                    <span className="text-xs text-white/70 bg-black/50 px-3 py-1 rounded-full">
                      {isAnalyzingPhoto ? 'Analizando plato con IA...' : 'Enfocá tu plato completo'}
                    </span>
                  </div>
                </div>
              )}

              {cameraMode === 'barcode' && (
                <div className="relative flex-1 flex flex-col items-center justify-center overflow-hidden p-4">
                  <div id="reader" className="w-full max-w-sm rounded-2xl overflow-hidden border-2 border-[#8ea885]"></div>
                </div>
              )}

              <div className="p-6 bg-[#0c0c0c] flex justify-center items-center">
                {cameraMode === 'photo' && (
                  <button 
                    onClick={handleCaptureAndAnalyze}
                    disabled={isAnalyzingPhoto}
                    className="w-16 h-16 bg-[#8ea885] rounded-full flex items-center justify-center text-black text-2xl font-bold shadow-lg"
                  >
                    {isAnalyzingPhoto ? '⏳' : '📸'}
                  </button>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
