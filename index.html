<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalori : Contá tus calorías</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0c0c0c; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    .font-serif-custom { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const localFoods = [
      { id: '1', name: 'Papa hervida / al horno', brand: 'Genérico', kcal: 87, protein: 1.9, carbs: 20.1, fat: 0.1, baseGrams: 100, icon: '🥔' },
      { id: '2', name: 'Papa frita', brand: 'Genérico', kcal: 312, protein: 3.4, carbs: 41, fat: 15, baseGrams: 100, icon: '🍟' },
      { id: '3', name: 'Batata / Camote', brand: 'Genérico', kcal: 86, protein: 1.6, carbs: 20, fat: 0.1, baseGrams: 100, icon: '🍠' },
      { id: '4', name: 'Pechuga de Pollo', brand: 'Cocida', kcal: 165, protein: 31, carbs: 0, fat: 3.6, baseGrams: 100, icon: '🍗' },
      { id: '5', name: 'Carne Vacuna / Bife', brand: 'Magra', kcal: 250, protein: 26, carbs: 0, fat: 15, baseGrams: 100, icon: '🥩' },
      { id: '6', name: 'Carne Molida Magra', brand: 'Genérico', kcal: 215, protein: 20, carbs: 0, fat: 14, baseGrams: 100, icon: '🥩' },
      { id: '7', name: 'Milanesa de Carne', brand: 'Al horno', kcal: 220, protein: 22, carbs: 15, fat: 8, baseGrams: 100, icon: '🥩' },
      { id: '8', name: 'Milanesa de Pollo', brand: 'Al horno', kcal: 210, protein: 24, carbs: 14, fat: 7, baseGrams: 100, icon: '🍗' },
      { id: '9', name: 'Huevo hervido', brand: 'Unidad (50g env.)', kcal: 155, protein: 13, carbs: 1.1, fat: 11, baseGrams: 100, icon: '🥚' },
      { id: '10', name: 'Arroz Blanco Cocido', brand: 'Genérico', kcal: 130, protein: 2.7, carbs: 28, fat: 0.3, baseGrams: 100, icon: '🍚' },
      { id: '11', name: 'Fideos / Pasta Cocida', brand: 'Genérico', kcal: 158, protein: 5.8, carbs: 31, fat: 0.9, baseGrams: 100, icon: '🍝' },
      { id: '12', name: 'Pan Lactal Blanco', brand: 'Común', kcal: 265, protein: 9, carbs: 49, fat: 3.2, baseGrams: 100, icon: '🍞' },
      { id: '13', name: 'Pan Integral', brand: 'Genérico', kcal: 247, protein: 12, carbs: 41, fat: 3.4, baseGrams: 100, icon: '🍞' },
      { id: '14', name: 'Banana', brand: 'Fresca', kcal: 89, protein: 1.1, carbs: 22.8, fat: 0.3, baseGrams: 100, icon: '🍌' },
      { id: '15', name: 'Manzana', brand: 'Fresca', kcal: 52, protein: 0.3, carbs: 13.8, fat: 0.2, baseGrams: 100, icon: '🍎' },
      { id: '16', name: 'Frutilla', brand: 'Fresca', kcal: 32, protein: 0.7, carbs: 7.7, fat: 0.3, baseGrams: 100, icon: '🍓' },
      { id: '17', name: 'Avena en Copos', brand: 'Instantánea', kcal: 389, protein: 16.9, carbs: 66, fat: 6.9, baseGrams: 100, icon: '🥣' },
      { id: '18', name: 'Leche Entera', brand: 'Genérico', kcal: 60, protein: 3.2, carbs: 4.8, fat: 3.2, baseGrams: 100, icon: '🥛' },
      { id: '19', name: 'Leche Descremada', brand: 'Genérico', kcal: 35, protein: 3.4, carbs: 5, fat: 0.1, baseGrams: 100, icon: '🥛' },
      { id: '20', name: 'Yogur Entero', brand: 'Genérico', kcal: 61, protein: 3.5, carbs: 4.7, fat: 3.3, baseGrams: 100, icon: '🥛' },
      { id: '21', name: 'Queso Cream / Untable', brand: 'Genérico', kcal: 240, protein: 7, carbs: 4, fat: 22, baseGrams: 100, icon: '🧀' },
      { id: '22', name: 'Atún al agua', brand: 'Lata escurrida', kcal: 116, protein: 26, carbs: 0, fat: 1, baseGrams: 100, icon: '🐟' },
      { id: '23', name: 'Manteca', brand: 'Común', kcal: 717, protein: 0.9, carbs: 0.1, fat: 81, baseGrams: 100, icon: '🧈' },
      { id: '24', name: 'Aceite de Oliva', brand: 'Genérico', kcal: 884, protein: 0, carbs: 0, fat: 100, baseGrams: 100, icon: '🫒' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('hoy');
      const [userName, setUserName] = useState('Usuario');
      const [selectedMeal, setSelectedMeal] = useState('Desayuno');
      const [showSearch, setShowSearch] = useState(false);
      const [showCamera, setShowCamera] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [apiFoods, setApiFoods] = useState([]);
      const [loadingSearch, setLoadingSearch] = useState(false);
      
      const [water, setWater] = useState(0);
      const [waterGoal, setWaterGoal] = useState(2000);
      
      const [activeMenuMeal, setActiveMenuMeal] = useState(null);
      const [selectedFoodForDetail, setSelectedFoodForDetail] = useState(null);
      
      const [portionQty, setPortionQty] = useState(100);
      const [portionUnit, setPortionUnit] = useState('gramos');
      const [targetMeal, setTargetMeal] = useState('Desayuno');

      const [mealsData, setMealsData] = useState({
        Desayuno: [],
        Almuerzo: [],
        Merienda: [],
        Cena: [],
        'Snack 1': []
      });

      const videoRef = useRef(null);

      useEffect(() => {
        let stream = null;
        if (showCamera) {
          navigator.mediaDevices?.getUserMedia({ video: { facingMode: 'environment' } })
            .then(s => {
              stream = s;
              if (videoRef.current) videoRef.current.srcObject = s;
            })
            .catch(() => {});
        }
        return () => {
          if (stream) stream.getTracks().forEach(track => track.stop());
        };
      }, [showCamera]);

      useEffect(() => {
        if (!searchTerm.trim() || searchTerm.length < 3) {
          setApiFoods([]);
          return;
        }

        const timer = setTimeout(async () => {
          setLoadingSearch(true);
          try {
            const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(searchTerm)}&search_simple=1&action=process&json=1&page_size=10`);
            const data = await res.json();
            if (data.products) {
              const mapped = data.products
                .filter(p => p.product_name && p.nutriments)
                .map((p, idx) => ({
                  id: p.code || `api-${idx}`,
                  name: p.product_name,
                  brand: p.brands || 'Marca Global',
                  kcal: Math.round(p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal'] || 100),
                  protein: Math.round((p.nutriments.proteins_100g || 0) * 10) / 10,
                  carbs: Math.round((p.nutriments.carbohydrates_100g || 0) * 10) / 10,
                  fat: Math.round((p.nutriments.fat_100g || 0) * 10) / 10,
                  baseGrams: 100,
                  icon: '🥗'
                }));
              setApiFoods(mapped);
            }
          } catch (e) {}
          setLoadingSearch(false);
        }, 400);

        return () => clearTimeout(timer);
      }, [searchTerm]);

      const calculateTotals = () => {
        let totalKcal = 0, totalP = 0, totalC = 0, totalF = 0;
        Object.values(mealsData).flatMap(m => m).forEach(item => {
          totalKcal += item.kcal;
          totalP += item.protein;
          totalC += item.carbs;
          totalF += item.fat;
        });
        return {
          kcal: Math.round(totalKcal),
          protein: Math.round(totalP),
          carbs: Math.round(totalC),
          fat: Math.round(totalF)
        };
      };

      const totals = calculateTotals();

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return 'Buenos días';
        if (hour < 20) return 'Buenas tardes';
        return 'Buenas noches';
      };

      const handleOpenDetail = (food, meal = 'Desayuno') => {
        setSelectedFoodForDetail(food);
        setPortionQty(food.baseGrams || 100);
        setPortionUnit('gramos');
        setTargetMeal(meal);
      };

      const handleConfirmAddFood = () => {
        if (!selectedFoodForDetail) return;
        const ratio = portionQty / (selectedFoodForDetail.baseGrams || 100);
        const newItem = {
          ...selectedFoodForDetail,
          id: Date.now().toString(),
          grams: portionQty,
          kcal: Math.round(selectedFoodForDetail.kcal * ratio),
          protein: Math.round(selectedFoodForDetail.protein * ratio * 10) / 10,
          carbs: Math.round(selectedFoodForDetail.carbs * ratio * 10) / 10,
          fat: Math.round(selectedFoodForDetail.fat * ratio * 10) / 10
        };

        setMealsData(prev => ({
          ...prev,
          [targetMeal]: [...prev[targetMeal], newItem]
        }));

        setSelectedFoodForDetail(null);
        setShowSearch(false);
        setShowCamera(false);
      };

      const handleClearMeal = (mealName) => {
        setMealsData(prev => ({ ...prev, [mealName]: [] }));
        setActiveMenuMeal(null);
      };

      const handleAddWater = (amount) => {
        setWater(prev => Math.max(0, prev + amount));
      };

      const filteredLocal = localFoods.filter(f => f.name.toLowerCase().includes(searchTerm.toLowerCase()));
      const combinedResults = [...filteredLocal, ...apiFoods.filter(a => !filteredLocal.some(l => l.name.toLowerCase() === a.name.toLowerCase()))];

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#0c0c0c] text-white flex flex-col justify-between pb-24 relative select-none">
          
          {/* VISTA HOY */}
          {activeTab === 'hoy' && (
            <header className="p-4 pt-6">
              <div className="flex justify-between items-center text-xs text-gray-400 font-medium mb-3">
                <span className="tracking-widest uppercase text-[#8ea885] font-bold">KALORI</span>
                <div className="flex items-center gap-3 bg-[#181818] px-3 py-1 rounded-full text-gray-300">
                  <span>&lt;</span>
                  <span className="text-white font-semibold">Hoy</span>
                  <span>&gt;</span>
                </div>
              </div>

              <div className="flex items-center gap-2 mb-4">
                <h1 className="text-3xl font-serif-custom font-normal tracking-tight">
                  {getGreeting()}, {userName}
                </h1>
                <button onClick={() => setActiveTab('perfil')} className="text-xs bg-[#222] text-gray-400 px-2 py-1 rounded-lg">✏️</button>
              </div>

              {/* Anillo de Calorías Consumidas (Libre / Sin Restricciones) */}
              <div className="bg-[#161616] rounded-3xl p-6 border border-[#222222] shadow-xl">
                <div className="flex items-center justify-between">
                  <div className="relative w-36 h-36 flex items-center justify-center">
                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                      <path className="text-gray-800" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                      <path className="text-[#8ea885]" strokeDasharray={`${Math.min(100, (totals.kcal / 2000) * 100)}, 100`} strokeWidth="3" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div className="absolute flex flex-col items-center">
                      <span className="text-3xl font-serif-custom font-bold">{totals.kcal}</span>
                      <span className="text-[11px] text-gray-400">kcal de hoy</span>
                    </div>
                  </div>

                  <div className="flex-1 ml-6 flex flex-col gap-3">
                    <div className="text-xs text-gray-400 font-medium mb-1">
                      Macronutrientes
                    </div>
                    {[
                      { label: 'Proteína', val: totals.protein },
                      { label: 'Carbos', val: totals.carbs },
                      { label: 'Grasas', val: totals.fat }
                    ].map((m, idx) => (
                      <div key={idx} className="space-y-1">
                        <div className="flex justify-between text-[11px]">
                          <span className="text-gray-400">{m.label}</span>
                          <span className="font-semibold">{m.val} g</span>
                        </div>
                        <div className="h-1.5 w-full bg-[#262626] rounded-full overflow-hidden">
                          <div className="h-full bg-[#8ea885] rounded-full" style={{ width: `${Math.min(100, (m.val / 150) * 100)}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Control de Agua */}
              <div className="bg-[#161616] rounded-3xl p-5 mt-4 border border-[#222222]">
                <div className="flex justify-between items-center mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-blue-400">💧</span>
                    <span className="font-serif-custom text-lg">Agua</span>
                  </div>
                  <span className="text-xs text-gray-400">{(water / 1000).toFixed(2)} L registrados</span>
                </div>
                <div className="h-2 w-full bg-[#262626] rounded-full overflow-hidden mb-4">
                  <div className="h-full bg-blue-500 rounded-full transition-all duration-300" style={{ width: `${Math.min(100, (water / waterGoal) * 100)}%` }}></div>
                </div>
                
                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => handleAddWater(250)} className="py-2.5 bg-[#222222] hover:bg-[#2a2a2a] rounded-2xl text-xs font-semibold text-gray-200 border border-[#333]">+250 ml</button>
                  <button onClick={() => handleAddWater(500)} className="py-2.5 bg-[#222222] hover:bg-[#2a2a2a] rounded-2xl text-xs font-semibold text-gray-200 border border-[#333]">+500 ml</button>
                  <button onClick={() => handleAddWater(-250)} className="py-2.5 bg-[#222222] hover:bg-[#2a2a2a] rounded-2xl text-xs font-semibold text-red-300 border border-[#333]">-250 ml</button>
                  <button onClick={() => setWater(0)} className="py-2.5 bg-[#222222] hover:bg-[#2a2a2a] rounded-2xl text-xs font-semibold text-gray-400 border border-[#333]">Reset</button>
                </div>
              </div>

              {/* Secciones de Comidas tipo Fitia */}
              <div className="mt-6 space-y-4">
                {['Desayuno', 'Almuerzo', 'Merienda', 'Cena', 'Snack 1'].map((mealName) => {
                  const items = mealsData[mealName] || [];
                  const mealKcal = items.reduce((a, b) => a + b.kcal, 0);

                  return (
                    <div key={mealName} className="bg-[#161616] rounded-3xl p-5 border border-[#222222] relative">
                      <div className="flex justify-between items-start mb-2">
                        <div>
                          <h3 className="text-lg font-serif-custom">{mealName}</h3>
                          <p className="text-xs text-gray-400 mt-0.5">{mealKcal} kcal</p>
                        </div>
                        <button onClick={() => setActiveMenuMeal(activeMenuMeal === mealName ? null : mealName)} className="text-gray-400 hover:text-white p-1">•••</button>
                      </div>

                      {activeMenuMeal === mealName && (
                        <div className="absolute right-4 top-12 z-30 bg-[#1f1f1f] border border-[#333] rounded-2xl py-2 w-52 shadow-2xl backdrop-blur-md">
                          <button className="w-full text-left px-4 py-2 text-xs hover:bg-[#2a2a2a] flex justify-between"><span>Copiar</span> <span>📋</span></button>
                          <button className="w-full text-left px-4 py-2 text-xs hover:bg-[#2a2a2a] flex justify-between"><span>Repetir Comida</span> <span>♾️</span></button>
                          <button onClick={() => handleClearMeal(mealName)} className="w-full text-left px-4 py-2 text-xs hover:bg-[#2a2a2a] text-red-400 flex justify-between"><span>Vaciar comida</span> <span>🗑️</span></button>
                        </div>
                      )}

                      {items.length > 0 ? (
                        <div className="my-3 space-y-2 border-t border-[#262626] pt-3">
                          {items.map((item) => (
                            <div key={item.id} className="flex justify-between items-center text-xs">
                              <span className="text-gray-200">{item.icon} {item.name} ({item.grams}g)</span>
                              <span className="font-semibold text-gray-300">{item.kcal} kcal</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <p className="text-xs text-gray-500 my-3">Todavía vacío. Sumá algo.</p>
                      )}

                      <button 
                        onClick={() => { setSelectedMeal(mealName); setShowSearch(true); }}
                        className="w-full py-2.5 bg-[#222222] hover:bg-[#2a2a2a] rounded-2xl text-gray-300 font-bold text-lg"
                      >
                        +
                      </button>
                    </div>
                  );
                })}
              </div>
            </header>
          )}

          {/* VISTA PROGRESO */}
          {activeTab === 'progreso' && (
            <div className="p-5 pt-8">
              <h2 className="text-2xl font-serif-custom mb-4">Registro Histórico</h2>
              <div className="bg-[#161616] rounded-3xl p-5 border border-[#222]">
                <p className="text-xs text-gray-400 mb-2">Total consumido hoy</p>
                <div className="text-3xl font-bold font-serif-custom mb-4">{totals.kcal} kcal</div>
                <div className="flex justify-between items-end h-32 pt-4 border-t border-[#262626]">
                  {['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((day, idx) => (
                    <div key={idx} className="flex flex-col items-center gap-2">
                      <div className="w-6 bg-[#262626] rounded-t-lg relative" style={{ height: '80px' }}>
                        <div className="absolute bottom-0 w-full bg-[#8ea885] rounded-t-lg" style={{ height: idx === 4 ? `${Math.min(100, (totals.kcal / 2000) * 100)}%` : '0%' }}></div>
                      </div>
                      <span className="text-[10px] text-gray-400">{day}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* VISTA PERFIL */}
          {activeTab === 'perfil' && (
            <div className="p-5 pt-8">
              <h2 className="text-2xl font-serif-custom mb-6">Tu Perfil</h2>
              <div className="bg-[#161616] rounded-3xl p-5 border border-[#222] space-y-4">
                <div>
                  <label className="text-xs text-gray-400 block mb-1">Nombre de usuario</label>
                  <input 
                    type="text" 
                    value={userName} 
                    onChange={(e) => setUserName(e.target.value)}
                    className="w-full bg-[#222] border border-[#333] rounded-xl px-4 py-2 text-sm text-white font-semibold"
                  />
                </div>
              </div>
            </div>
          )}

          {/* Nav Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0c0c0c]/90 backdrop-blur-md border-t border-[#222] flex justify-around items-center py-3 z-20">
            <button onClick={() => setActiveTab('hoy')} className={`flex flex-col items-center gap-1 ${activeTab === 'hoy' ? 'text-[#8ea885]' : 'text-gray-500'}`}>
              <span className="text-lg">🏠</span><span className="text-[10px]">Hoy</span>
            </button>
            
            <button onClick={() => setShowCamera(true)} className="flex flex-col items-center justify-center w-12 h-12 bg-[#8ea885] text-black rounded-full font-bold shadow-lg">
              <span>📷</span>
            </button>

            <button onClick={() => setActiveTab('progreso')} className={`flex flex-col items-center gap-1 ${activeTab === 'progreso' ? 'text-[#8ea885]' : 'text-gray-500'}`}>
              <span className="text-lg">📊</span><span className="text-[10px]">Progreso</span>
            </button>

            <button onClick={() => setActiveTab('perfil')} className={`flex flex-col items-center gap-1 ${activeTab === 'perfil' ? 'text-[#8ea885]' : 'text-gray-500'}`}>
              <span className="text-lg">👤</span><span className="text-[10px]">Perfil</span>
            </button>
          </nav>

          {/* MODAL BUSCADOR */}
          {showSearch && (
            <div className="fixed inset-0 z-40 bg-[#0c0c0c] flex flex-col p-4 max-w-md mx-auto">
              <div className="flex items-center gap-3 mb-4">
                <button onClick={() => setShowSearch(false)} className="text-xl">←</button>
                <input 
                  type="text" 
                  placeholder="Ej. papa, milanesa, huevo..." 
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="flex-1 bg-[#1a1a1a] border border-[#333] rounded-full px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#8ea885]"
                />
              </div>

              <div className="flex-1 overflow-y-auto space-y-3">
                <div className="flex justify-between items-center">
                  <h4 className="text-xs text-gray-500 uppercase tracking-wider font-semibold">Alimentos Disponibles</h4>
                  {loadingSearch && <span className="text-xs text-[#8ea885] animate-pulse">Buscando marcas...</span>}
                </div>

                {combinedResults.map(food => (
                  <div 
                    key={food.id}
                    onClick={() => handleOpenDetail(food, selectedMeal)}
                    className="p-3 bg-[#161616] rounded-2xl border border-[#222] flex items-center justify-between cursor-pointer hover:bg-[#202020]"
                  >
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">{food.icon}</span>
                      <div>
                        <div className="font-medium text-sm">{food.name}</div>
                        <div className="text-xs text-gray-400">{food.brand} • por 100g</div>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="text-xs text-gray-300 font-semibold">{food.kcal} kcal</div>
                      <div className="text-[10px] text-gray-500">{food.protein}P | {food.carbs}C | {food.fat}G</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* MODAL CÁMARA */}
          {showCamera && (
            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between max-w-md mx-auto">
              <div className="p-4 flex justify-between items-center z-10">
                <button onClick={() => setShowCamera(false)} className="text-white text-2xl">✕</button>
                <span className="text-xs font-semibold bg-black/60 px-3 py-1 rounded-full">Escanea tu plato o código</span>
                <div className="w-6"></div>
              </div>

              <div className="relative flex-1 flex items-center justify-center overflow-hidden">
                <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover"></video>
                <div className="absolute w-64 h-64 border-2 border-white/80 rounded-3xl pointer-events-none"></div>
              </div>

              <div className="p-6 bg-[#0c0c0c] flex flex-col gap-4 items-center">
                <button 
                  onClick={() => handleOpenDetail(localFoods[0], selectedMeal)}
                  className="w-16 h-16 bg-[#8ea885] rounded-full flex items-center justify-center text-black text-2xl font-bold shadow-lg"
                >
                  📸
                </button>
              </div>
            </div>
          )}

          {/* MODAL DETALLE Y PORCIONES */}
          {selectedFoodForDetail && (
            <div className="fixed inset-0 z-50 bg-[#0c0c0c] flex flex-col p-4 max-w-md mx-auto overflow-y-auto">
              <div className="flex justify-between items-center mb-4">
                <button onClick={() => setSelectedFoodForDetail(null)} className="text-xl">←</button>
              </div>

              <div className="flex flex-col items-center text-center my-2">
                <div className="w-16 h-16 bg-[#1a1a1a] rounded-2xl flex items-center justify-center text-3xl mb-2">
                  {selectedFoodForDetail.icon}
                </div>
                <h2 className="text-xl font-bold">{selectedFoodForDetail.name}</h2>
                <p className="text-xs text-gray-400">{selectedFoodForDetail.brand}</p>
              </div>

              {(() => {
                const ratio = portionQty / (selectedFoodForDetail.baseGrams || 100);
                const k = Math.round(selectedFoodForDetail.kcal * ratio);
                const p = (selectedFoodForDetail.protein * ratio).toFixed(1);
                const c = (selectedFoodForDetail.carbs * ratio).toFixed(1);
                const f = (selectedFoodForDetail.fat * ratio).toFixed(1);

                return (
                  <div>
                    <div className="grid grid-cols-4 gap-2 my-4">
                      <div className="bg-[#161616] p-3 rounded-2xl text-center border border-[#222]">
                        <div className="text-base font-bold">{k}</div>
                        <div className="text-[10px] text-gray-400">kcal</div>
                      </div>
                      <div className="bg-[#161616] p-3 rounded-2xl text-center border border-[#222]">
                        <div className="text-base font-bold">{p} g</div>
                        <div className="text-[10px] text-gray-400">prot</div>
                      </div>
                      <div className="bg-[#161616] p-3 rounded-2xl text-center border border-[#222]">
                        <div className="text-base font-bold">{c} g</div>
                        <div className="text-[10px] text-gray-400">carbs</div>
                      </div>
                      <div className="bg-[#161616] p-3 rounded-2xl text-center border border-[#222]">
                        <div className="text-base font-bold">{f} g</div>
                        <div className="text-[10px] text-gray-400">grasas</div>
                      </div>
                    </div>

                    <div className="bg-[#161616] p-4 rounded-2xl border border-[#222] my-4 flex justify-between items-center">
                      <span className="text-xs text-gray-400">Cantidad (Gramos)</span>
                      <input 
                        type="number" 
                        value={portionQty} 
                        onChange={(e) => setPortionQty(Number(e.target.value) || 0)}
                        className="w-24 bg-[#222] border border-[#333] rounded-xl px-3 py-1.5 text-right text-sm font-bold text-white"
                      />
                    </div>

                    <button 
                      onClick={handleConfirmAddFood}
                      className="w-full py-4 bg-[#8ea885] text-black font-bold text-sm rounded-full shadow-lg transition-colors mt-4"
                    >
                      Agregar a {targetMeal}
                    </button>
                  </div>
                );
              })()}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
